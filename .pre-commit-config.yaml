# Pre-commit hooks for web3home-infra
# Runs on every `git commit` — blocks commit if any hook fails
# Install hooks into this repo with: pre-commit install
# Update hook versions periodically with: pre-commit autoupdate

repos:
  # Secret scanner — primary defense against committing credentials
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # General hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: '\.sops\.ya?ml$|\.enc\.ya?ml$|secrets/.*\.ya?ml$'
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: detect-private-key

  # Shell script linting
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
  # Real-address scanner — gitleaks matches credential shapes and has no
  # concept of an IP, so it will never catch these. Added 2026-07-25 after the
  # home WAN address was found in JOURNAL.md on a public repo.
  # NOTE: the 91.64. prefix is the current ISP pool — re-check this rule after
  # any WAN rotation, or it silently stops protecting anything.
  - repo: local
    hooks:
      - id: no-real-ips
        name: block real WAN/LAN addresses
        language: pygrep
        entry: '\b(91\.64\.\d{1,3}\.\d{1,3}|192\.168\.31\.\d{1,3})\b'
        types: [text]
        exclude: '^\.pre-commit-config\.yaml$'
