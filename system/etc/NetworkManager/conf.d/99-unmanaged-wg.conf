# wg-quick@wg0 owns this interface and its policy rules (priority 100/101 plus
# the fwmark rules). NetworkManager adopted wg0 on 2026-09-24, flushed those
# rules, and left the tunnel up but unroutable - a week of remote lockout with
# handshakes still succeeding.
[keyfile]
unmanaged-devices=interface-name:wg0
