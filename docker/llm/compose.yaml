services:
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server-vulkan@sha256:0db4cbd35400e6b262dd24826006fb6c2c93eb9fdb0282dad5555483e0a8ab42
    container_name: llama-server
    restart: unless-stopped
    devices:
      - /dev/dri/renderD128
    group_add:
      - "991"   # render (host GID)
    environment:
      - LLAMA_ATTN_ROT_DISABLE=1   # qwen4exp attention path aborts at load without it
    volumes:
      - /srv/dm/ceph/llm/models:/models:ro
    command: >
      -m /models/qwen38-flash-next/UD-IQ4_XS/Qwen3.8-Flash-Next-UD-IQ4_XS-00001-of-00003.gguf
      --mmproj /models/qwen38-flash-next/mmproj-F16.gguf
      --jinja
      -ngl 999
      -fa on
      -ot per_layer_token_embd=CPU
      -c 131072
      --parallel 2
      --image-min-tokens 1024
      --host 0.0.0.0
      --port 8000
      --alias qwen3.8-flash-next-UD
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    networks:
      - llm-internal

  open-webui:
    image: ghcr.io/open-webui/open-webui@sha256:8b432fe0a65b91116afc7961365c6cca5379cc923171386a96691f3471f3cae9
    container_name: open-webui
    restart: unless-stopped
    depends_on:
      - llama-server
    environment:
      - OPENAI_API_BASE_URL=http://llama-server:8000/v1
      - OPENAI_API_KEY=sk-noauth   # llama-server ignores it, but WebUI requires a value
      - WEBUI_AUTH=True
    volumes:
      - /srv/dm/ceph/llm/webui-data:/app/backend/data
    ports:
      - "3000:8080"
    networks:
      - llm-internal

networks:
  llm-internal:
    driver: bridge
