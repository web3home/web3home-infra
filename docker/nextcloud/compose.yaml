# Nextcloud — migrated from Odroid M1 (ARM64) to bee001 (amd64)
#
# Storage: CephFS-backed (/srv/dm/ceph/nextcloud/*), LUKS-encrypted OSD underneath
# Database: Postgres 18 (service pgdb) since 2026-11-07, converted from MariaDB with
#   occ db:convert-type. MariaDB kept stopped under profile legacy-mariadb for rollback.
# Image: official nextcloud:33 (multi-arch -> amd64). NOT the custom -pdlib build.
#   Consequence: no pdlib face-recognition; Memories ARM binaries disabled in config.
#   Upgraded 32 -> 33 (33.0.5); occ upgrade ran clean on container restart.
# TLS: terminated upstream by Traefik on Odroid (file-route), same pattern as Ghost.
# No GPU passthrough yet, no AppAPI, no Traefik labels (file-provider route instead).

services:
  db:
    image: mariadb:10.11
    container_name: nextcloud-db
    # Retired 2026-11-07: Nextcloud runs on pgdb. Not started at boot; rollback:
    #   docker compose --profile legacy-mariadb start db, restore the saved config.php.
    profiles: ["legacy-mariadb"]
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    volumes:
      - /srv/dm/ceph/nextcloud/db:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
      MYSQL_USER: "${MYSQL_USER}"
    networks:
      - nextcloud-internal

  redis:
    image: redis:latest
    container_name: nextcloud-redis
    restart: unless-stopped
    # Cache + file locks only — regenerable, so persistence is all cost and no
    # benefit. cephfs-shutdown-guard SIGKILLs containers at shutdown (docker stop
    # is what wedged reboots, 2026-06-13), racing redis mid-AOF-append -> corrupt
    # tail -> crash-loop on next boot. No AOF, no RDB, no data dir => nothing to
    # corrupt. See JOURNAL 2026-07-15.
    # List form is deliberate: `--save ""` needs the empty arg preserved, and the
    # string form would drop it.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - nextcloud-internal

  pgdb:
    # Postgres 18 replaces MariaDB (whose data sits on CephFS). Data on local disk
    # in a named volume, like serytemura; backed up by pg_dump in restic-backup.sh,
    # never as files. The 18 image keeps data in /var/lib/postgresql/18/docker, so
    # the volume mounts at /var/lib/postgresql (NOT .../data).
    image: postgres:18-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
    container_name: nextcloud-pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: "${NC_PG_PASSWORD}"
    volumes:
      - nextcloud-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextcloud -d nextcloud"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nextcloud-internal

  app:
    image: nextcloud-ffmpeg:35
    build:
      context: .
      args:
        NEXTCLOUD_IMAGE: nextcloud:35@sha256:d88929dc8386420b8963f86cabb667fdaf733eef9dcf8fc98e226801a32c023c
    container_name: nextcloud-app
    restart: unless-stopped
    depends_on:
      - pgdb
      - redis
    volumes:
      - /srv/dm/ceph/nextcloud/html:/var/www/html
      - /srv/dm/ceph/nextcloud/data:/var/www/html/data
    environment:
      REDIS_HOST: redis
      PHP_MEMORY_LIMIT: 4096M
      PHP_UPLOAD_LIMIT: 32G
      OVERWRITEPROTOCOL: https
      OVERWRITEHOST: nextcloud003.web3home.info
      OVERWRITECLIURL: https://nextcloud003.web3home.info
      APACHE_SERVER_NAME: nextcloud003.web3home.info
    ports:
      - "${NC_BIND_IP:-127.0.0.1}:8080:80"
    networks:
      - nextcloud-internal
      - traefik

  cron:
    image: nextcloud-ffmpeg:35
    build:
      context: .
      args:
        NEXTCLOUD_IMAGE: nextcloud:35@sha256:d88929dc8386420b8963f86cabb667fdaf733eef9dcf8fc98e226801a32c023c
    container_name: nextcloud-cron
    restart: unless-stopped
    depends_on:
      - pgdb
      - redis
    volumes:
      - /srv/dm/ceph/nextcloud/html:/var/www/html
      - /srv/dm/ceph/nextcloud/data:/var/www/html/data
    entrypoint: /cron.sh
    # Clustering (Recognize MrdBallTree) runs HERE, not in the app container.
    # Without this the cron container got PHP's stock 512M and every
    # recognize:cluster-faces run died with "Allowed memory size exhausted" —
    # silently, since cron swallows it. Face clustering was dead from 2026-06-27
    # to 2026-10-11 for this one missing line.
    environment:
      PHP_MEMORY_LIMIT: 8192M
    mem_limit: 12g
    memswap_limit: 12g
    networks:
      - nextcloud-internal

networks:
  traefik:
    external: true
    name: traefik
  nextcloud-internal:
    driver: bridge

volumes:
  nextcloud-pgdata:
